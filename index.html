<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clay Workdesk · Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Holtwood+One+SC&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="portfolio.css" />

<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #efe7df; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #efe7df; z-index: 50;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #8a7f73; letter-spacing: 0.16em; font-size: 12px; text-transform: uppercase;
    transition: opacity 0.7s ease; pointer-events: none;
  }
  #loading.hidden { opacity: 0; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid #d8cdbf; border-top-color: #8a7f73;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* orbit hint */
  #hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #9b9084; background: rgba(255,255,255,0.55); backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 999px; z-index: 20;
    border: 1px solid rgba(160,148,132,0.18);
    transition: opacity 0.6s ease; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }

  /* scroll-to-enter affordance */
  #enterCue {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 20; pointer-events: none; transition: opacity 0.5s ease;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8d8174;
  }
  #enterCue.hidden { opacity: 0; }
  #enterCue .chev {
    width: 16px; height: 16px; border-right: 2px solid #b0a290; border-bottom: 2px solid #b0a290;
    transform: rotate(45deg); animation: nudge 1.6s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: rotate(45deg) translate(-2px, -2px); opacity: 0.35; }
    50% { transform: rotate(45deg) translate(2px, 2px); opacity: 1; }
  }

  /* ---------- end-user scene settings: compact, collapsible dock, bottom-right ---------- */
  #sceneSettingsDock {
    position: fixed; right: 16px; bottom: 16px; z-index: 25;
    width: 176px;
    background: rgba(250,246,240,0.9); backdrop-filter: blur(12px);
    border: 1px solid rgba(58,51,43,0.1); border-radius: 13px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 14px 28px -16px rgba(74,58,42,0.5);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    overflow: hidden;
  }
  .ss-dock-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; cursor: pointer; user-select: none;
  }
  .ss-dock-head span {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    color: #8b8072;
  }
  .ss-dock-head svg { width: 13px; height: 13px; color: #8b8072; transition: transform 0.18s ease; }
  #sceneSettingsDock.collapsed .ss-dock-head svg { transform: rotate(180deg); }
  .ss-dock-body {
    padding: 0 10px 10px; display: flex; flex-direction: column; gap: 10px;
    max-height: 300px; transition: max-height 0.2s ease, padding 0.2s ease, opacity 0.15s ease;
    opacity: 1;
  }
  #sceneSettingsDock.collapsed .ss-dock-body {
    max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0;
  }
  .ss-group h4 {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    color: #a89c8a; margin: 0 0 5px;
  }
  .ss-options { display: flex; gap: 5px; }
  .ss-option {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1px solid rgba(58,51,43,0.1); background: #fff; cursor: pointer;
    border-radius: 8px; padding: 6px 2px; text-align: center;
    font-family: inherit; font-size: 9.5px; font-weight: 500; color: #5d5446;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .ss-option:hover { background: #fdf9f3; }
  .ss-option svg { width: 15px; height: 15px; }
  .ss-option.active { border-color: #c0764f; background: #fdf2ea; color: #3a332b; font-weight: 700; }
</style>

<!-- Tweaks (React) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#efe7df"/>
      <rect x="34" y="36" width="32" height="22" rx="3" fill="#3a332b"/>
      <rect x="37" y="39" width="26" height="16" rx="1.5" fill="#c0764f"/>
      <rect x="46" y="58" width="8" height="5" fill="#3a332b"/>
      <rect x="38" y="63" width="24" height="3" rx="1.5" fill="#3a332b"/>
    </svg>
  </template>
  <canvas id="scene"></canvas>

  <div id="enterCue"><span>scroll to enter</span><span class="chev"></span></div>
  <div id="hint">drag to orbit · scroll to enter</div>
  <div id="loading"><div class="spinner"></div><div>sculpting the desk…</div></div>

  <!-- =========================================================
       PORTFOLIO — revealed by diving into the monitor screen
       ========================================================= -->
  <main id="portfolio" data-screen-label="Portfolio">
    <button id="backToDesk" class="pf-back pf-back-floating">← Back to desk</button>
    <iframe
      id="framer-embed"
      src="https://haopeng.framer.website/"
      title="Haopeng · Portfolio"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </main>

  <!-- End-user scene settings (garden + time of day) — always visible, collapsible, one click to change -->
  <div id="sceneSettingsDock">
    <div class="ss-dock-head" id="sceneSettingsToggle">
      <span>Choose a Scene</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="ss-dock-body">
      <div class="ss-group">
        <h4>Garden</h4>
        <div class="ss-options" data-group="garden">
          <button class="ss-option" data-value="clay" title="Sculpted clay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15c0-4 3-9 8-9s8 5 8 9-4 5-8 5-8-1-8-5z"/></svg>
            Clay
          </button>
          <button class="ss-option" data-value="color" title="Low-poly color">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 8.5 12 21 3 8.5 12 3Z"/><path d="M12 3v18M3 8.5h18"/></svg>
            Color
          </button>
          <button class="ss-option" data-value="painterly" title="Soft painterly">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c3-1 3-4 1-6-2-2-1-6 2-7 4-1.5 8 1 9 5 .8 3.2-1 6-4 6-2 0-2-2-3.5-2S8 20 4 20Z"/><circle cx="9" cy="9" r="1"/></svg>
            Paint
          </button>
        </div>
      </div>
      <div class="ss-group">
        <h4>Time of day</h4>
        <div class="ss-options" data-group="timeOfDay">
          <button class="ss-option" data-value="day" title="Day">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
            Day
          </button>
          <button class="ss-option" data-value="dusk" title="Dusk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h16M6 17a6 6 0 0 1 12 0"/><path d="M12 4v4M6.5 8.5l1.4 1.4M17.5 8.5l-1.4 1.4"/><path d="M2 20h20"/></svg>
            Dusk
          </button>
          <button class="ss-option" data-value="night" title="Night">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
            Night
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var STORE_KEY = 'sceneTweaks';
      var state = { garden: 'clay', timeOfDay: 'day' };
      try {
        var saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        state = Object.assign(state, saved);
      } catch (e) {}

      var dock = document.getElementById('sceneSettingsDock');
      var toggle = document.getElementById('sceneSettingsToggle');
      // Collapse state is session-only (not persisted) so every fresh visit starts expanded.
      toggle.addEventListener('click', function () {
        dock.classList.toggle('collapsed');
      });

      function apply() {
        window.__tweaks = Object.assign({}, window.__tweaks, state);
        if (window.__applyTweaks) window.__applyTweaks(state);
        window.dispatchEvent(new CustomEvent('tweakschange', { detail: state }));
        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
      }

      function render() {
        document.querySelectorAll('.ss-options').forEach(function (row) {
          var group = row.getAttribute('data-group');
          row.querySelectorAll('.ss-option').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-value') === state[group]);
          });
        });
      }

      document.querySelectorAll('.ss-option').forEach(function (b) {
        b.addEventListener('click', function () {
          var group = b.parentElement.getAttribute('data-group');
          state[group] = b.getAttribute('data-value');
          render();
          apply();
        });
      });

      render();
      apply();
    })();
  </script>

  <!-- Tweaks panel + bridge (design-time only, gated by the host's edit-mode protocol) -->
  <div id="tweaks-root"></div>

  <!-- user-fillable image placeholders -->
  <script src="image-slot.js"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- 3D scene -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
